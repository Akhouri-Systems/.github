<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="282" viewBox="0 0 900 282" role="img" aria-label="About Akhouri Systems">
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rv{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dash{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.cur{animation:blink 1.1s steps(1) infinite}
.dot{animation:pulse 2s ease-in-out infinite}
.glow{animation:breathe 3.2s ease-in-out infinite}
.fi{animation:fadein .8s ease both}
.rv{transform-box:fill-box;transform-origin:left center;animation:rv 1.4s steps(30) both}
.run{stroke-dasharray:90 910;animation:dash 7s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<filter id="blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="blur2" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#f2c44e" stroke-opacity="0.045" stroke-width="1"/></pattern>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#e0b64a"/><stop offset="0.45" stop-color="#f2c44e"/><stop offset="0.5" stop-color="#fff4c9"/><stop offset="0.55" stop-color="#f2c44e"/><stop offset="1" stop-color="#e0b64a"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-320 0" to="320 0" dur="5s" repeatCount="indefinite"/></linearGradient>
</defs>
<rect width="900" height="282" fill="#0a0d12"/>
<text x="4" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="32" font-weight="800" fill="#f2c44e" filter="url(#blur2)" opacity="0.5">~/</text><text x="4" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="32" font-weight="800"><tspan fill="#f2c44e">~/</tspan><tspan fill="#f1efe8">about</tspan></text><line x1="0" y1="54" x2="900" y2="54" stroke="#232831" stroke-width="2"/><line x1="0" y1="54" x2="135" y2="54" stroke="#f2c44e" stroke-width="2"/><text x="896" y="38" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="14" fill="#7b7f8a">// 01</text><text x="4" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="14.5" fill="#7b7f8a"><tspan fill="#3ddc97">$</tspan> cat about.txt</text><rect x="1" y="106" width="898" height="174" fill="url(#grid)" stroke="#d8b25a" stroke-opacity="0.3"/><path d="M1 128 V106 H23" fill="none" stroke="#f2c44e" stroke-width="2.4"/><path d="M877 280 H899 V258" fill="none" stroke="#f2c44e" stroke-width="2.4"/><clipPath id="t4"><rect class="rv" x="32" y="130" width="820" height="28" style="animation-delay:0.2s;animation-duration:1.2s"/></clipPath><g clip-path="url(#t4)"><text x="36" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="17" fill="#f2c44e">&gt;&gt; <tspan fill="#f1efe8" font-weight="700">a software manufacturing company, based in india.</tspan></text></g><clipPath id="t5"><rect class="rv" x="32" y="160" width="820" height="28" style="animation-delay:1.5s;animation-duration:1.2s"/></clipPath><g clip-path="url(#t5)"><text x="36" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="17" fill="#f2c44e">&gt;&gt; <tspan fill="#f1efe8" font-weight="700">four desktop tools, one philosophy:</tspan></text></g><clipPath id="t6"><rect class="rv" x="32" y="190" width="820" height="28" style="animation-delay:2.8000000000000003s;animation-duration:1.2s"/></clipPath><g clip-path="url(#t6)"><text x="36" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="17" fill="#f2c44e">&gt;&gt; <tspan fill="#f1efe8" font-weight="700">if the default app frustrates you, it gets replaced.</tspan></text></g><clipPath id="t7"><rect class="rv" x="32" y="220" width="820" height="28" style="animation-delay:4.1000000000000005s;animation-duration:1.2s"/></clipPath><g clip-path="url(#t7)"><text x="36" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="17" fill="#f2c44e">&gt;&gt; <tspan fill="#f1efe8" font-weight="700">every product is free, portable and offline-first.</tspan></text></g>
</svg>
