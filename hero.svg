<text x="38" y="184" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="66" font-weight="800" textLength="600" lengthAdjust="spacing" fill="#f2c44e" filter="url(#blur)" class="glow">AKHOURI SYSTEMS</text>
