<text x="28" y="29" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="13" letter-spacing="1.6" fill="#d8b25a">SYS://AKHOURI-SYSTEMS // ORG:INDIA</text>
