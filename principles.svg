<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="234" viewBox="0 0 900 234" role="img" aria-label="Principles: free, portable, offline-first, private">
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rv{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dash{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.cur{animation:blink 1.1s steps(1) infinite}
.dot{animation:pulse 2s ease-in-out infinite}
.glow{animation:breathe 3.2s ease-in-out infinite}
.fi{animation:fadein .8s ease both}
.rv{transform-box:fill-box;transform-origin:left center;animation:rv 1.4s steps(30) both}
.run{stroke-dasharray:90 910;animation:dash 7s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<filter id="blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="blur2" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#f2c44e" stroke-opacity="0.045" stroke-width="1"/></pattern>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#e0b64a"/><stop offset="0.45" stop-color="#f2c44e"/><stop offset="0.5" stop-color="#fff4c9"/><stop offset="0.55" stop-color="#f2c44e"/><stop offset="1" stop-color="#e0b64a"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-320 0" to="320 0" dur="5s" repeatCount="indefinite"/></linearGradient>
</defs>
<rect width="900" height="234" fill="#0a0d12"/>
<text x="4" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="32" font-weight="800" fill="#f2c44e" filter="url(#blur2)" opacity="0.5">~/</text><text x="4" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="32" font-weight="800"><tspan fill="#f2c44e">~/</tspan><tspan fill="#f1efe8">principles</tspan></text><line x1="0" y1="54" x2="900" y2="54" stroke="#232831" stroke-width="2"/><line x1="0" y1="54" x2="230" y2="54" stroke="#f2c44e" stroke-width="2"/><text x="896" y="38" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="14" fill="#7b7f8a">// 03</text><text x="4" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="14.5" fill="#7b7f8a"><tspan fill="#3ddc97">$</tspan> cat principles.conf</text><polygon points="1,106 195,106 209,120 209,232 1,232" fill="#07080b" stroke="#d8b25a" stroke-opacity="0.45" stroke-width="1.3"/><path d="M196 232 H208 V220" fill="none" stroke="#f2c44e" stroke-width="2"/><text x="18" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="12" letter-spacing="2" fill="#7b7f8a">RULE // 01</text><text x="18" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="19" font-weight="800" fill="#f2c44e" filter="url(#blur)" class="glow">FREE</text>
<text x="18" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="19" font-weight="800" fill="#f2c44e">FREE</text><text x="18" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="12.5" fill="#d8d4c6">every product is free</text><text x="18" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="12.5" fill="#d8d4c6">to download.</text><polygon points="231,106 425,106 439,120 439,232 231,232" fill="#07080b" stroke="#d8b25a" stroke-opacity="0.45" stroke-width="1.3"/><path d="M426 232 H438 V220" fill="none" stroke="#f2c44e" stroke-width="2"/><text x="248" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="12" letter-spacing="2" fill="#7b7f8a">RULE // 02</text><text x="248" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="19" font-weight="800" fill="#f2c44e" filter="url(#blur)" class="glow">PORTABLE</text>
<text x="248" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="19" font-weight="800" fill="#f2c44e">PORTABLE</text><text x="248" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="12.5" fill="#d8d4c6">single .exe,</text><text x="248" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="12.5" fill="#d8d4c6">no installer.</text><polygon points="461,106 655,106 669,120 669,232 461,232" fill="#07080b" stroke="#d8b25a" stroke-opacity="0.45" stroke-width="1.3"/><path d="M656 232 H668 V220" fill="none" stroke="#f2c44e" stroke-width="2"/><text x="478" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="12" letter-spacing="2" fill="#7b7f8a">RULE // 03</text><text x="478" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="16.5" font-weight="800" fill="#f2c44e" filter="url(#blur)" class="glow">OFFLINE-FIRST</text>
<text x="478" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="16.5" font-weight="800" fill="#f2c44e">OFFLINE-FIRST</text><text x="478" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="12.5" fill="#d8d4c6">built to run on your</text><text x="478" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="12.5" fill="#d8d4c6">machine, not a server.</text><polygon points="691,106 885,106 899,120 899,232 691,232" fill="#07080b" stroke="#d8b25a" stroke-opacity="0.45" stroke-width="1.3"/><path d="M886 232 H898 V220" fill="none" stroke="#f2c44e" stroke-width="2"/><text x="708" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="12" letter-spacing="2" fill="#7b7f8a">RULE // 04</text><text x="708" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="19" font-weight="800" fill="#f2c44e" filter="url(#blur)" class="glow">PRIVATE</text>
<text x="708" y="168" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="19" font-weight="800" fill="#f2c44e">PRIVATE</text><text x="708" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="12.5" fill="#d8d4c6">no accounts,</text><text x="708" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="12.5" fill="#d8d4c6">no telemetry.</text>
</svg>
