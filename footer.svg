<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="196" viewBox="0 0 900 196" role="img" aria-label="Your machine. Your data. Your control.">
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rv{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dash{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.cur{animation:blink 1.1s steps(1) infinite}
.dot{animation:pulse 2s ease-in-out infinite}
.glow{animation:breathe 3.2s ease-in-out infinite}
.fi{animation:fadein .8s ease both}
.rv{transform-box:fill-box;transform-origin:left center;animation:rv 1.4s steps(30) both}
.run{stroke-dasharray:90 910;animation:dash 7s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<filter id="blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="blur2" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#f2c44e" stroke-opacity="0.045" stroke-width="1"/></pattern>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#e0b64a"/><stop offset="0.45" stop-color="#f2c44e"/><stop offset="0.5" stop-color="#fff4c9"/><stop offset="0.55" stop-color="#f2c44e"/><stop offset="1" stop-color="#e0b64a"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-320 0" to="320 0" dur="5s" repeatCount="indefinite"/></linearGradient>
</defs>
<rect width="900" height="196" fill="#0a0d12"/>
<rect x="1" y="1" width="898" height="194" fill="url(#grid)" stroke="#d8b25a" stroke-opacity="0.3"/><path d="M1 25 V1 H25" fill="none" stroke="#f2c44e" stroke-width="2.4"/><path d="M875 195 H899 V171" fill="none" stroke="#f2c44e" stroke-width="2.4"/><text x="48" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="14.5" fill="#7b7f8a"><tspan fill="#3ddc97">$</tspan> echo $PHILOSOPHY</text><text x="48" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="34" font-weight="800" textLength="775.1999999999999" lengthAdjust="spacing" fill="#f2c44e" filter="url(#blur)" class="glow">your machine. your data. your control.</text>
<text x="48" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="34" font-weight="800" textLength="775.1999999999999" lengthAdjust="spacing" fill="url(#shine)">your machine. your data. your control.</text><rect class="cur" x="833" y="74" width="18" height="34" fill="#f2c44e"/><line x1="48" y1="130" x2="852" y2="130" stroke="#d8b25a" stroke-opacity="0.25"/><text x="48" y="160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="14" fill="#7b7f8a"><tspan fill="#3ddc97">$</tspan> mail <tspan fill="#f2c44e" font-weight="700">akhourisystems@gmail.com</tspan></text><text x="852" y="160" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="13" fill="#7b7f8a">© 2026 Akhouri Systems · India</text>
</svg>
