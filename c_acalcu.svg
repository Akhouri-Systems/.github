<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="248" viewBox="0 0 400 248" role="img" aria-label="ACALCU — Most Customizable Calculator">
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rv{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dash{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.cur{animation:blink 1.1s steps(1) infinite}
.dot{animation:pulse 2s ease-in-out infinite}
.glow{animation:breathe 3.2s ease-in-out infinite}
.fi{animation:fadein .8s ease both}
.rv{transform-box:fill-box;transform-origin:left center;animation:rv 1.4s steps(30) both}
.run{stroke-dasharray:90 910;animation:dash 7s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<filter id="blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="blur2" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#f2c44e" stroke-opacity="0.045" stroke-width="1"/></pattern>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#e0b64a"/><stop offset="0.45" stop-color="#f2c44e"/><stop offset="0.5" stop-color="#fff4c9"/><stop offset="0.55" stop-color="#f2c44e"/><stop offset="1" stop-color="#e0b64a"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-320 0" to="320 0" dur="5s" repeatCount="indefinite"/></linearGradient>
</defs>
<polygon points="1,1 377,1 399,23 399,247 1,247" fill="#07080b" stroke="#d8b25a" stroke-opacity="0.5" stroke-width="1.4"/><rect x="1" y="1" width="398" height="246" fill="url(#grid)" opacity="0.6"/><polygon points="1,1 377,1 399,23 399,247 1,247" fill="none" stroke="#f2c44e" stroke-width="2" pathLength="1000" class="run"/><path d="M384 246 H398 V232" fill="none" stroke="#f2c44e" stroke-width="2.2"/><path d="M2 14 V2 H14" fill="none" stroke="#d8b25a" stroke-width="1.6"/><text x="24" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="11.5" letter-spacing="1.8" fill="#7b7f8a">PRODUCT // 03</text><rect x="301.2" y="19" width="54.8" height="22" rx="3" fill="#0b2a1c" stroke="#1f7a4d"/><text x="328.6" y="34" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="11" letter-spacing="1.4" fill="#3ddc97">LIVE</text><text x="24" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="38" font-weight="800" textLength="136.8" lengthAdjust="spacing" fill="#f2c44e" filter="url(#blur)" class="glow">ACALCU</text>
<text x="24" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="38" font-weight="800" textLength="136.8" lengthAdjust="spacing" fill="#f2c44e">ACALCU</text><path d="M182.8 62 L193.8 51 M184.8 51 H193.8 V60" fill="none" stroke="#d8b25a" stroke-width="2" stroke-linecap="square"/><text x="24" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="14.5" font-weight="700" fill="#f2c44e">Most Customizable Calculator</text><line x1="24" y1="124" x2="376" y2="124" stroke="#d8b25a" stroke-opacity="0.28"/><text x="24" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="13.5" fill="#d8d4c6">Every button, every layout, every</text><text x="24" y="171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="13.5" fill="#d8d4c6">behavior, built to be reshaped by you.</text><polygon points="24,196 81.8,196 87.8,202 87.8,220 24,220" fill="#14110a" stroke="#d8b25a" stroke-opacity="0.5"/><text x="55.9" y="211.8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="10.5" letter-spacing="1" fill="#d8b25a">CUSTOM</text><polygon points="95.8,196 168.2,196 174.2,202 174.2,220 95.8,220" fill="#14110a" stroke="#d8b25a" stroke-opacity="0.5"/><text x="135.0" y="211.8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="10.5" letter-spacing="1" fill="#d8b25a">PORTABLE</text><polygon points="182.2,196 269.2,196 275.2,202 275.2,220 182.2,220" fill="#14110a" stroke="#d8b25a" stroke-opacity="0.5"/><text x="228.7" y="211.8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Courier New',monospace" font-size="10.5" letter-spacing="1" fill="#d8b25a">ZERO BLOAT</text>
</svg>
